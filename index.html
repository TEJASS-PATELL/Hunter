
<!doctype html>
<html lang="en" class="sp-lock">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <meta name="theme-color" content="#ffffff" />
    <meta name="background-color" content="#ffffff" />
    <meta name="application-name" content="Comeback 90" />

    <meta
      name="description"
      content="Comeback 90 — build better habits, one day at a time."
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta name="apple-mobile-web-app-title" content="Comeback 90" />

    <title>Comeback 90</title>

    <link rel="manifest" href="/manifest.json" />

    <!-- Keep your real SVG logo for the browser tab -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

    <link rel="apple-touch-icon" href="/icons/icon.svg" />

    <style>
      :root {
        color-scheme: light;
        background: #ffffff;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #ffffff;
      }

      html.sp-lock,
      html.sp-lock body {
        overflow: hidden;
        overscroll-behavior: none;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 180ms ease,
          visibility 180ms ease;
      }

      #app-splash .splash-loader {
        width: 112px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #eeeeee;
      }

      #app-splash .splash-loader::after {
        content: "";
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: #222222;
        animation: splash-loading 1.05s ease-in-out infinite;
      }

      #app-splash.splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @keyframes splash-loading {
        0% {
          transform: translateX(-110%);
        }

        100% {
          transform: translateX(370%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-loader::after {
          animation-duration: 2.5s;
        }

        #app-splash {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="app-splash" aria-label="Loading Comeback 90">
      <div class="splash-loader" aria-hidden="true"></div>
    </div>

    <div id="root"></div>

    <script>
      (function () {
        var splash = document.getElementById("app-splash");
        var root = document.getElementById("root");
        var hidden = false;

        function hideSplash() {
          if (hidden || !splash) return;

          hidden = true;
          splash.classList.add("splash-hidden");
          document.documentElement.classList.remove("sp-lock");

          window.setTimeout(function () {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 220);
        }

        window.addEventListener("load", function () {
          requestAnimationFrame(function () {
            requestAnimationFrame(hideSplash);
          });
        });

        window.addEventListener("error", function (event) {
          if (event && event.target && event.target !== window) {
            return;
          }
        });

        // Safety fallback if the app takes longer to initialize.
        window.setTimeout(function () {
          if (root && root.childElementCount > 0) {
            hideSplash();
          }
        }, 12000);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
