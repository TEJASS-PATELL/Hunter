  </noscript>

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #fff;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: grid;
      place-items: center;
      padding:
        env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
      background: #fff;
      color: #0a0a0a;
      font-family:
        "Plus Jakarta Sans",
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
      -webkit-font-smoothing: antialiased;
      transition:
        opacity 0.3s ease,
        visibility 0s linear 0.3s;
    }

    #splash.sp-hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .sp-wrap {
      display: grid;
      justify-items: center;
      text-align: center;
      animation: sp-in 0.4s ease both;
    }

    .sp-bar {
      position: relative;
      width: 112px;
      height: 3px;
      margin-top: 28px;
      overflow: hidden;
      border-radius: 99px;
      background: #e8e8e8;
    }

    .sp-bar i {
      position: absolute;
      inset: 0 auto 0 0;
      width: 42%;
      border-radius: inherit;
      background: #0a0a0a;
      animation: sp-slide 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes sp-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes sp-slide {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(240%);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .sp-wrap,
      .sp-bar i {
        animation: none;
      }

      .sp-bar i {
        width: 100%;
        opacity: 0.3;
      }

      #splash {
        transition-duration: 0.01s;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <div id="splash" role="status" aria-live="polite" aria-label="Loading Comeback 90">
    <div class="sp-wrap">
      <div class="sp-bar" aria-hidden="true">
        <i></i>
      </div>
    </div>
  </div>

  <noscript>
    Comeback 90 needs JavaScript to run. Please enable it in your browser.
  </noscript>

  <script>
    (() => {
      const splash = document.getElementById("splash");
      const root = document.getElementById("root");

      if (!splash || !root) return;

      const started = Date.now();
      const MIN_SHOW = 350;
      let finished = false;
      let observer;

      function hideSplash() {
        if (finished) return;
        finished = true;

        if (observer) observer.disconnect();

        const fontsReady = document.fonts?.ready
          ? Promise.race([
            document.fonts.ready,
            new Promise((resolve) => setTimeout(resolve, 1200)),
          ])
          : Promise.resolve();

        fontsReady.then(() => {
          const wait = Math.max(
            0,
            MIN_SHOW - (Date.now() - started)
          );

          setTimeout(() => {
            requestAnimationFrame(() => {
              splash.classList.add("sp-hide");

              setTimeout(() => splash.remove(), 350);
            });
          }, wait);
        });
      }

      if ("MutationObserver" in window) {
        observer = new MutationObserver(() => {
          if (root.childElementCount > 0) {
            hideSplash();
          }
        });

        observer.observe(root, {
          childList: true,
        });
      }

      if (root.childElementCount > 0) {
        hideSplash();
      }
    })();
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
