
<!doctype html>

    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link

      href="https://fonts.gstatic.com"

    />

    <link
      rel="preload"

      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans+Code:wght@400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />

    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans+Code:wght@400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        margin: 0;
        min-height: 100%;
        background: #fff;
        color: #0a0a0a;
        -webkit-text-size-adjust: 100%;
        scrollbar-gutter: stable;
        overflow-x: hidden;
      }

      body {
        margin: 0;
        min-height: 100%;
        background: #fff;
        color: #0a0a0a;
        overflow-x: hidden;
      }

      /* Prevent scroll jumps while splash is active */
      html.sp-lock,
      html.sp-lock body {
        overflow: hidden;
        overscroll-behavior: none;
      }

      /* Minimal white splash screen */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        padding:
          env(safe-area-inset-top, 0px)
          env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
        background: #fff;
        color: #0a0a0a;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 0.25s ease,
          visibility 0s linear 0.25s;
      }

      #splash.sp-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .sp-wrap {
        display: grid;
        justify-items: center;
        text-align: center;
        animation: sp-in 0.3s ease both;
      }

      /* Thin loading indicator */
      .sp-bar {
        position: relative;
        width: 112px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #e8e8e8;
      }

      .sp-bar i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: #0a0a0a;
        animation: sp-slide 1.15s
          cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes sp-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes sp-slide {
        from {
          transform: translateX(-100%);
        }

        to {
          transform: translateX(270%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sp-wrap,
        .sp-bar i {
          animation: none;
        }

        .sp-bar i {
          width: 100%;
          opacity: 0.3;
        }

        #splash {
          transition-duration: 0.01s;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- White screen with loading bar only -->
    <div
      id="splash"
      role="status"
      aria-live="polite"
      aria-label="Loading Comeback 90"
    >
      <div class="sp-wrap">
        <div class="sp-bar" aria-hidden="true">
          <i></i>
        </div>
      </div>
    </div>

    <noscript>
      Comeback 90 needs JavaScript to run.
      Please enable it in your browser.
    </noscript>

    <script>
      (() => {
        const splash = document.getElementById("splash");
        const root = document.getElementById("root");
        const html = document.documentElement;

        if (!splash || !root) {
          html.classList.remove("sp-lock");
          return;
        }

        if ("scrollRestoration" in history) {
          history.scrollRestoration = "manual";
        }

        window.scrollTo(0, 0);

        const started = performance.now();
        const MIN_SHOW = 300;
        let finished = false;
        let observer = null;
        let fallbackTimer = null;

        function hideSplash() {
          if (finished || root.childElementCount === 0) {
            return;
          }

          finished = true;

          if (observer) {
            observer.disconnect();
          }

          if (fallbackTimer) {
            clearTimeout(fallbackTimer);
          }

          const fontsReady = document.fonts?.ready
            ? Promise.race([
                document.fonts.ready,
                new Promise((resolve) =>
                  setTimeout(resolve, 800)
                ),
              ])
            : Promise.resolve();

          fontsReady.then(() => {
            const wait = Math.max(
              0,
              MIN_SHOW - (performance.now() - started)
            );

            setTimeout(() => {
              requestAnimationFrame(() => {
                window.scrollTo(0, 0);
                html.classList.remove("sp-lock");
                splash.classList.add("sp-hide");

                setTimeout(() => {
                  splash.remove();
                }, 280);
              });
            }, wait);
          });
        }

        if ("MutationObserver" in window) {
          observer = new MutationObserver(() => {
            if (root.childElementCount > 0) {
              hideSplash();
            }
          });

          observer.observe(root, {
            childList: true,
          });
        }

        if (root.childElementCount > 0) {
          hideSplash();
        }

        /* Prevent an endless loading screen */
        fallbackTimer = setTimeout(() => {
          if (root.childElementCount > 0) {
            hideSplash();
          }
        }, 15000);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
