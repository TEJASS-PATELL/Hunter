<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <title>Comeback 90</title>
    <meta name="application-name" content="Comeback 90" />
    <meta
      name="description"
      content="Comeback 90: a private 90-day routine, habit and reset tracker. Your data stays on your device."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / Social Meta -->
    <meta property="og:title" content="Comeback 90" />
    <meta
      property="og:description"
      content="A private 90-day routine, habit and reset tracker. Your data stays on your device."
    />
    <meta property="og:type" content="website" />

    <!-- Mobile / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Comeback 90" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Fixed Clean SVG Icon (No Jagged Arrow Tip) -->
    <link
      id="app-favicon"
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0A0A'/%3E%3Cpath d='M 51 32 A 19 19 0 1 1 32 13' fill='none' stroke='%23FFFFFF' stroke-width='4.5' stroke-linecap='round'/%3E%3Cpath d='M 27 37 L 42 22 M 32 22 H 42 V 32' fill='none' stroke='%23FFFFFF' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='21' cy='43' r='3' fill='%23D9381E'/%3E%3C/svg%3E"
    />
    <link id="apple-touch-icon" rel="apple-touch-icon" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans+Code:wght@400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />

    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans+Code:wght@400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background-color: #ffffff;
        color: #0a0a0a;
        -webkit-text-size-adjust: 100%;
      }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        padding:
          env(safe-area-inset-top, 0px)
          env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
        background-color: #ffffff;
        transition:
          opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0s linear 0.32s;
      }

      #splash.sp-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .sp-mark {
        width: 64px;
        height: 64px;
        display: block;
        animation: sp-in 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .sp-mark svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .sp-arc {
        stroke-dasharray: 90;
        stroke-dashoffset: 90;
        animation: sp-draw 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @keyframes sp-in {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes sp-draw {
        to {
          stroke-dashoffset: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sp-mark,
        .sp-arc {
          animation: none;
        }

        .sp-arc {
          stroke-dashoffset: 0;
        }

        #splash {
          transition-duration: 0.01s;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- Minimal Splash: Pure White BG + Fixed Icon Only -->
    <div
      id="splash"
      role="status"
      aria-live="polite"
      aria-label="Loading Comeback 90"
    >
      <div class="sp-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <rect width="64" height="64" rx="14" fill="#0A0A0A" />
          <path
            class="sp-arc"
            d="M 51 32 A 19 19 0 1 1 32 13"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="4.5"
            stroke-linecap="round"
          />
          <path
            d="M 27 37 L 42 22 M 32 22 H 42 V 32"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="4.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="21" cy="43" r="3" fill="#D9381E" />
        </svg>
      </div>
    </div>

    <noscript>
      Comeback 90 needs JavaScript to run. Please enable it in your browser.
    </noscript>

    <script>
      (() => {
        const splash = document.getElementById("splash");
        const root = document.getElementById("root");

        // Auto-generate 180x180 PNG Apple Touch Icon & PWA Manifest
        const setupPwaAssets = () => {
          try {
            const svgMarkup = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="180" height="180">
              <rect width="64" height="64" rx="14" fill="#0A0A0A"/>
              <path d="M 51 32 A 19 19 0 1 1 32 13" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
              <path d="M 27 37 L 42 22 M 32 22 H 42 V 32" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="21" cy="43" r="3" fill="#D9381E"/>
            </svg>`;

            const svgUrl =
              "data:image/svg+xml;charset=utf-8," +
              encodeURIComponent(svgMarkup);

            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement("canvas");
              canvas.width = 180;
              canvas.height = 180;
              const ctx = canvas.getContext("2d");
              if (!ctx) return;
              ctx.drawImage(img, 0, 0, 180, 180);
              const pngDataUrl = canvas.toDataURL("image/png");

              const appleLink = document.getElementById("apple-touch-icon");
              if (appleLink) appleLink.href = pngDataUrl;

              const manifest = {
                name: "Comeback 90",
                short_name: "Comeback 90",
                description:
                  "A private 90-day routine, habit and reset tracker.",
                start_url: "/",
                display: "standalone",
                background_color: "#FFFFFF",
                theme_color: "#FFFFFF",
                icons: [
                  {
                    src: pngDataUrl,
                    sizes: "180x180",
                    type: "image/png",
                    purpose: "any maskable",
                  },
                ],
              };

              const manifestBlob = new Blob([JSON.stringify(manifest)], {
                type: "application/manifest+json",
              });
              const manifestLink = document.createElement("link");
              manifestLink.rel = "manifest";
              manifestLink.href = URL.createObjectURL(manifestBlob);
              document.head.appendChild(manifestLink);
            };
            img.src = svgUrl;
          } catch (_) {}
        };

        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(setupPwaAssets);
        } else {
          setTimeout(setupPwaAssets, 200);
        }

        if (!splash || !root) return;

        const started = performance.now();
        const MIN_SHOW = 350;
        let finished = false;
        let observer = null;

        function hideSplash() {
          if (finished) return;
          finished = true;

          if (observer) observer.disconnect();

          const fontsReady = document.fonts?.ready
            ? Promise.race([
                document.fonts.ready,
                new Promise((resolve) => setTimeout(resolve, 1200)),
              ])
            : Promise.resolve();

          fontsReady.then(() => {
            const wait = Math.max(0, MIN_SHOW - (performance.now() - started));

            setTimeout(() => {
              requestAnimationFrame(() => {
                splash.classList.add("sp-hide");
                setTimeout(() => splash.remove(), 350);
              });
            }, wait);
          });
        }

        if ("MutationObserver" in window) {
          observer = new MutationObserver(() => {
            if (root.childElementCount > 0) {
              hideSplash();
            }
          });

          observer.observe(root, {
            childList: true,
          });
        }

        if (root.childElementCount > 0) {
          hideSplash();
        }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
